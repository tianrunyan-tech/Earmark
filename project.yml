name: Earmark

options:
  bundleIdPrefix: com.tianrunyan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Fill in your Apple Developer Team ID here, or pick the team in Xcode
    # under Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Earmark:
    type: application
    platform: iOS
    sources:
      - Earmark
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tianrunyan.earmark
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Earmark
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Earmark/Earmark.entitlements
    dependencies:
      - target: EarmarkShare
    scheme:
      testTargets:
        - EarmarkTests

  EarmarkShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tianrunyan.earmark.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements

  EarmarkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EarmarkTests
    dependencies:
      - target: Earmark
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
